<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PingasGPT</title>

<link rel="stylesheet" href="/client/1.css">
</head>

<body>

<header>
    <div class="brand">
        <div class="logo">
    <img src="/pingasgpt.png" alt="PingasGPT">
</div>
        <div>
            <div class="brand-name">PingasGPT</div>
            <div class="brand-subtitle">[BETA]</div>
        </div>
    </div>

    <div class="status" id="status">
        <span class="status-dot"></span>
        <span id="statusText">Loading...</span>
    </div>
</header>

<main>
    <div id="chat"></div>

    <footer>
        <div class="composer">
            <textarea
                id="messageInput"
                placeholder="Message PingasGPT..."
                rows="1"
            ></textarea>

            <button id="sendButton" title="Send message">SEND</button>
        </div>

        <div class="bottom-info">
            <span id="networkInfo">Initializing network...</span>

            <div class="actions">
                <button id="statsButton">Network stats</button>
                <button id="clearButton">Clear chat</button>
            </div>
        </div>
    </footer>
</main>

<script src="/script.js"></script>
<script src="/script-imagegen.js"></script>

<script src="/client/1.js" defer></script>

</body>
</html>
