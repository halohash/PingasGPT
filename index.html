<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PingasGPT</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    color-scheme: dark;
    --background: #101419;
    --surface: #191f26;
    --surface2: #222a33;
    --border: #303b46;
    --accent: #35b7b0;
    --text: #e8eeee;
    --muted: #89969f;
}

body {
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    background: var(--background);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    flex-direction: column;
}

header {
    height: 62px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    overflow: hidden;
    flex-shrink: 0;
}

.logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

.brand-name {
    font-size: 18px;
    font-weight: bold;
}

.brand-subtitle {
    font-size: 11px;
    color: var(--muted);
    margin-top: 3px;
}

.status {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 7px;
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #e0a644;
}

.status.ready .status-dot {
    background: #48c98a;
}

.status.error .status-dot {
    background: #e45d5d;
}

main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px max(18px, calc((100% - 850px) / 2));
    display: flex;
    flex-direction: column;
    gap: 22px;
    scroll-behavior: smooth;
}

.message {
    display: flex;
    gap: 12px;
    max-width: 100%;
    animation: appear .2s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(5px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.message.user {
    flex-direction: row-reverse;
}

.avatar {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    border-radius: 10px;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: var(--accent);
    font-size: 14px;
}

.user .avatar {
    background: #315c66;
    color: white;
}

.content {
    max-width: 80%;
    min-width: 0;
}

.sender {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 7px;
}

.user .sender {
    text-align: right;
}

.bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 12px 15px;
    border-radius: 4px 14px 14px 14px;
    line-height: 1.6;
    font-size: 14px;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

.user .bubble {
    background: #20454b;
    border-color: #32636a;
    border-radius: 14px 4px 14px 14px;
}

.typing {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px 14px 14px 14px;
    width: fit-content;
}

.typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: bounce .8s infinite alternate;
}

.typing span:nth-child(2) {
    animation-delay: .2s;
}

.typing span:nth-child(3) {
    animation-delay: .4s;
}

@keyframes bounce {
    to {
        opacity: .3;
        transform: translateY(-5px);
    }
}

footer {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 15px 18px;
}

.composer {
    max-width: 850px;
    margin: auto;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 8px;
}

#messageInput {
    flex: 1;
    min-width: 0;
    min-height: 42px;
    max-height: 160px;
    resize: none;
    border: 0;
    outline: none;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 14px;
    line-height: 1.5;
    padding: 11px 9px;
}

#messageInput::placeholder {
    color: #84929a;
}

#sendButton {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 11px;
    background: var(--accent);
    color: #102222;
    cursor: pointer;
    font-size: 20px;
    font-weight: bold;
    flex-shrink: 0;
}

#sendButton:hover {
    filter: brightness(1.1);
}

#sendButton:disabled {
    opacity: .4;
    cursor: default;
}

.bottom-info {
    max-width: 850px;
    margin: 10px auto 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    color: var(--muted);
}

.actions {
    display: flex;
    gap: 14px;
}

.actions button {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 11px;
}

.actions button:hover {
    color: var(--accent);
}

@media(max-width: 600px) {
    header {
        height: 56px;
        padding: 0 13px;
    }

    #chat {
        padding: 18px 12px;
    }

    .content {
        max-width: 88%;
    }

    footer {
        padding: 10px;
    }

    .bottom-info {
        padding: 0 4px;
    }
}
</style>
</head>

<body>

<header>
    <div class="brand">
        <div class="logo">
    <img src="/pingasgpt.png" alt="PingasGPT">
</div>
        <div>
            <div class="brand-name">PingasGPT</div>
            <div class="brand-subtitle">[BETA]</div>
        </div>
    </div>

    <div class="status" id="status">
        <span class="status-dot"></span>
        <span id="statusText">Loading...</span>
    </div>
</header>

<main>
    <div id="chat"></div>

    <footer>
        <div class="composer">
            <textarea
                id="messageInput"
                placeholder="Message PingasGPT..."
                rows="1"
            ></textarea>

            <button id="sendButton" title="Send message">↑</button>
        </div>

        <div class="bottom-info">
            <span id="networkInfo">Initializing network...</span>

            <div class="actions">
                <button id="statsButton">Network stats</button>
                <button id="clearButton">Clear chat</button>
            </div>
        </div>
    </footer>
</main>

<script src="/pingasgpt.js"></script>

<script>
(function () {
    "use strict";

    const $ = id => document.getElementById(id);

    const chat = $("chat");
    const input = $("messageInput");
    const sendButton = $("sendButton");

    let ready = false;
    let busy = false;

    function setStatus(state, message) {
        $("status").className = "status " + state;
        $("statusText").textContent = message;
    }

    function scrollToBottom() {
        chat.scrollTop = chat.scrollHeight;
    }

    function addMessage(role, text) {
        const message = document.createElement("div");
        message.className = "message " + role;

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = role === "user" ? "U" : "P";

        const content = document.createElement("div");
        content.className = "content";

        const sender = document.createElement("div");
        sender.className = "sender";
        sender.textContent = role === "user" ? "You" : "PingasGPT";

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;

        content.appendChild(sender);
        content.appendChild(bubble);

        message.appendChild(avatar);
        message.appendChild(content);

        chat.appendChild(message);

        scrollToBottom();

        return message;
    }

    function showTyping() {
        const message = document.createElement("div");
        message.className = "message";
        message.id = "typingIndicator";

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = "P";

        const content = document.createElement("div");
        content.className = "content";

        const sender = document.createElement("div");
        sender.className = "sender";
        sender.textContent = "PingasGPT";

        const indicator = document.createElement("div");
        indicator.className = "typing";

        for (let i = 0; i < 3; i++) {
            indicator.appendChild(
                document.createElement("span")
            );
        }

        content.appendChild(sender);
        content.appendChild(indicator);

        message.appendChild(avatar);
        message.appendChild(content);

        chat.appendChild(message);

        scrollToBottom();
    }

    function hideTyping() {
        const indicator = $("typingIndicator");

        if (indicator) {
            indicator.remove();
        }
    }

    function updateStats() {
        if (!ready) return;

        const stats = PingasGPT.getStats();

        $("networkInfo").textContent =
            stats.words.toLocaleString() + " words · " +
            stats.associations.toLocaleString() + " connections";
    }

    async function initialize() {
        try {
            setStatus("", "Loading network");

            await PingasGPT.load();

            ready = true;

            setStatus("ready", "Online");

            updateStats();

        } catch (error) {
            console.error(error);

            setStatus("error", "Failed to load");

            $("networkInfo").textContent =
                "Could not load PingasGPT";
        }
    }

    async function sendMessage() {
        const text = input.value.trim();

        if (!text || busy || !ready) return;

        busy = true;
        sendButton.disabled = true;

        input.value = "";
        input.style.height = "42px";

        addMessage("user", text);

        showTyping();

        try {
            // Allow the browser to render the typing indicator.
            await new Promise(resolve => setTimeout(resolve, 30));

            const response = await PingasGPT.ask(text);

            hideTyping();

            addMessage(
                "assistant",
                response || " "
            );

            updateStats();

        } catch (error) {
            console.error(error);

            hideTyping();

            addMessage(
                "assistant",
                "An error occurred while generating a response."
            );
        }

        busy = false;
        sendButton.disabled = false;

        input.focus();
    }

    sendButton.addEventListener("click", sendMessage);

    input.addEventListener("keydown", event => {
        if (
            event.key === "Enter" &&
            !event.shiftKey &&
            !event.isComposing
        ) {
            event.preventDefault();
            sendMessage();
        }
    });

    input.addEventListener("input", () => {
        input.style.height = "42px";

        input.style.height =
            Math.min(input.scrollHeight, 160) + "px";
    });

    $("clearButton").addEventListener("click", () => {
        if (busy) return;

        chat.replaceChildren();

        PingasGPT.clearMemory();

        updateStats();
    });

    $("statsButton").addEventListener("click", () => {
        if (!ready) return;

        const stats = PingasGPT.getStats();

        const report = Object.entries(stats)
            .map(([key, value]) => key + ": " + value)
            .join("\n");

        addMessage("assistant", report);
    });

    initialize();

})();
</script>

</body>
</html>
